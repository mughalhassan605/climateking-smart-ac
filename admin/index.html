<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClimateKing Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --surface-2: #f0f3f7; --border: #e2e7ee;
    --text: #15202b; --text-2: #4b5966; --muted: #8592a0;
    --accent: #1f8fff; --ok: #16a34a; --ok-bg: #e8f7ee; --warn: #c27c0e; --warn-bg: #fdf3e1;
    --bad: #dc2626; --bad-bg: #fdecec; --idle: #64748b; --idle-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e141b; --surface: #16202a; --surface-2: #1c2834; --border: #263442;
      --text: #e8eef4; --text-2: #b3c0cc; --muted: #7d8b98;
      --accent: #4aa8ff; --ok: #34d399; --ok-bg: #12312a; --warn: #f2b13d; --warn-bg: #3a2c12;
      --bad: #f87171; --bad-bg: #3a1a1c; --idle: #94a3b8; --idle-bg: #222e3a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e141b; --surface: #16202a; --surface-2: #1c2834; --border: #263442;
    --text: #e8eef4; --text-2: #b3c0cc; --muted: #7d8b98;
    --accent: #4aa8ff; --ok: #34d399; --ok-bg: #12312a; --warn: #f2b13d; --warn-bg: #3a2c12;
    --bad: #f87171; --bad-bg: #3a1a1c; --idle: #94a3b8; --idle-bg: #222e3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .sub { color: var(--muted); font-size: 13px; }
  button, .btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  input { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile .n { font-size: 28px; font-weight: 700; }
  .tile .l { color: var(--text-2); font-size: 13px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .ok { color: var(--ok); background: var(--ok-bg); } .warn { color: var(--warn); background: var(--warn-bg); }
  .bad { color: var(--bad); background: var(--bad-bg); } .idle { color: var(--idle); background: var(--idle-bg); }
  .list { display: grid; gap: 8px; }
  .issue { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
  .issue .what { font-weight: 600; }
  .issue .fix { color: var(--text-2); font-size: 14px; margin-top: 2px; }
  .issue .who { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .user { padding: 0; overflow: hidden; }
  .user summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .user summary::-webkit-details-marker { display: none; }
  .user .meta { color: var(--muted); font-size: 12px; }
  .devices { border-top: 1px solid var(--border); padding: 12px 16px 16px; display: grid; gap: 10px; background: var(--surface-2); }
  .dev { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .dev .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dev .facts { display: flex; gap: 14px; flex-wrap: wrap; color: var(--text-2); font-size: 13px; margin-top: 6px; }
  .dev .note { margin-top: 8px; font-size: 14px; }
  .cmds { margin-top: 8px; font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
  .empty { color: var(--muted); padding: 12px 0; }
  .login { max-width: 360px; margin: 12vh auto 0; display: grid; gap: 10px; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search { max-width: 280px; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const MIN = 60 * 1000;
const app = document.getElementById('app');
let sb = null;
let data = null;
let filter = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = iso => {
  if (!iso) return 'never';
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < MIN) return 'just now';
  if (ms < 60 * MIN) return `${Math.round(ms / MIN)} min ago`;
  if (ms < 48 * 60 * MIN) return `${Math.round(ms / 60 / MIN)} h ago`;
  return `${Math.round(ms / 24 / 60 / MIN)} days ago`;
};
const fresh = (iso, minutes) => iso && Date.now() - new Date(iso).getTime() < minutes * MIN;

// Plain-language meaning and fix for each kind of problem.
const CAUSES = {
  working: { tone: 'ok', label: 'Working', what: 'Working normally.' },
  noBridge: {
    tone: 'bad', label: 'Home Bridge off',
    what: 'The Home Bridge at this home is off, so the AC cannot be controlled from outside the home.',
    fix: 'Switch on the computer or phone that runs the Home Bridge, and check it is connected to the home Wi-Fi.',
  },
  unreachable: {
    tone: 'warn', label: 'Not answering',
    what: 'The Home Bridge is on, but this AC does not answer.',
    fix: 'Check the AC has power. If the Wi-Fi router or password changed, connect the AC again with “Connect a new AC” in the app.',
  },
  needsKey: {
    tone: 'warn', label: 'Needs key',
    what: 'The AC was found, but the app does not have its security key yet.',
    fix: 'For Smart Life units run “tuya-sync” on the bridge; for Haier get the key with “haismart-keys”.',
  },
  neverSeen: {
    tone: 'idle', label: 'Never connected',
    what: 'This AC was added but has never been reached.',
    fix: 'Make sure the Home Bridge is running at that home and the AC is on the same Wi-Fi.',
  },
};

const ERROR_TYPES = {
  GREE_UDP_TIMEOUT: ['The AC did not reply in time.', 'Usually a weak Wi-Fi signal or the AC lost power. Move the router closer or check the AC.'],
  TUYA_LOCAL_KEY_MISSING: ['A Smart Life AC is missing its key.', 'Run “tuya-sync” on the Home Bridge.'],
  TUYA_SOCKET_FAILED: ['Could not open a connection to a Smart Life AC.', 'Restart the AC (switch off at the plug for 1 minute).'],
  NETWORK_UNREACHABLE: ['The phone had no network.', 'Nothing to fix on the AC; the user was offline.'],
  DEVICE_OFFLINE: ['A command could not reach the AC.', 'Check the Home Bridge is on and the AC has power.'],
  AUTH_FAILED: ['Sign-in failed.', 'Wrong password or the account does not exist.'],
  UNHANDLED_EXCEPTION: ['The app hit an unexpected error.', 'Send this to the developer.'],
  COMMAND_EXPIRED: ['A command was not delivered in time.', 'The Home Bridge was off when the user pressed the button.'],
  COMMAND_FAILED: ['A command reached the bridge but the AC refused or did not answer.', 'Check the AC has power and Wi-Fi.'],
};

function deviceCause(d, bridgeOnline) {
  if (d.status === 'online' && fresh(d.last_seen, 3)) return 'working';
  if (!bridgeOnline) return 'noBridge';
  if (d.last_error && /key/i.test(d.last_error)) return 'needsKey';
  if (!d.last_seen) return 'neverSeen';
  return 'unreachable';
}

function model() {
  const byOwner = new Map();
  const ensure = id => {
    if (!byOwner.has(id)) byOwner.set(id, { id, email: '(unknown user)', devices: [], bridges: [], errors: [], commands: [] });
    return byOwner.get(id);
  };
  data.users.forEach(u => Object.assign(ensure(u.id), { email: u.email, lastSignInAt: u.lastSignInAt, createdAt: u.createdAt }));
  data.bridges.forEach(b => ensure(b.owner_id).bridges.push(b));
  data.devices.forEach(d => d.owner_id && ensure(d.owner_id).devices.push(d));
  data.errors.forEach(e => e.owner_id && ensure(e.owner_id).errors.push(e));
  data.commands.forEach(c => ensure(c.owner_id).commands.push(c));

  const issues = [];
  for (const u of byOwner.values()) {
    u.bridgeOnline = u.bridges.some(b => fresh(b.last_seen, 1));
    u.devices.forEach(d => {
      d.cause = deviceCause(d, u.bridgeOnline);
      d.recent = u.commands.filter(c => c.device_id === d.id).slice(0, 5);
      if (d.cause !== 'working') issues.push({ cause: d.cause, user: u, device: d });
    });
    u.worst = u.devices.some(d => d.cause === 'noBridge') ? 'bad' : u.devices.some(d => d.cause !== 'working') ? 'warn' : u.devices.length ? 'ok' : 'idle';
  }
  const problems = [
    ...data.errors.map(e => ({ type: e.error_type, at: e.created_at, owner: e.owner_id, detail: e.message })),
    ...data.commands.filter(c => c.status === 'failed' || c.status === 'expired')
      .map(c => ({ type: c.status === 'expired' ? 'COMMAND_EXPIRED' : 'COMMAND_FAILED', at: c.created_at, owner: c.owner_id, detail: c.error })),
  ];
  return { users: [...byOwner.values()], issues, problems, byOwner };
}

function render() {
  const m = model();
  const devices = data.devices;
  const working = devices.filter(d => d.cause === 'working').length;
  const bridgesOn = data.bridges.filter(b => fresh(b.last_seen, 1)).length;
  const q = filter.toLowerCase();
  const users = m.users
    .filter(u => !q || (u.email || '').toLowerCase().includes(q) || u.devices.some(d => (d.name || '').toLowerCase().includes(q)))
    .sort((a, b) => ['bad', 'warn', 'ok', 'idle'].indexOf(a.worst) - ['bad', 'warn', 'ok', 'idle'].indexOf(b.worst));

  const grouped = {};
  m.problems.forEach(p => {
    const g = (grouped[p.type] ||= { type: p.type, count: 0, owners: new Set(), last: p.at, sample: p.detail });
    g.count += 1; g.owners.add(p.owner);
    if (p.at > g.last) g.last = p.at;
  });

  app.innerHTML = `
    <header>
      <div><h1>ClimateKing Admin</h1><div class="sub">Updated ${esc(ago(data.generatedAt))} · signed in as ${esc(data.viewer)}</div></div>
      <div class="row"><button id="refresh">Refresh</button><button id="logout">Sign out</button></div>
    </header>
    <div class="tiles">
      ${tile(m.users.length, 'Users')}
      ${tile(devices.length, 'ACs')}
      ${tile(working, 'Working now', 'ok')}
      ${tile(devices.length - working, 'Need attention', devices.length - working ? 'warn' : '')}
      ${tile(bridgesOn + ' / ' + data.bridges.length, 'Home Bridges on')}
      ${tile(m.problems.length, 'Problems (7 days)', m.problems.length ? 'bad' : '')}
    </div>

    <h2>What needs attention</h2>
    <div class="list">${m.issues.length ? m.issues.map(issueCard).join('') : '<div class="card empty">Nothing right now. Every AC is working.</div>'}</div>

    <h2>Problems in the last 7 days</h2>
    <div class="list">${Object.values(grouped).length ? Object.values(grouped).sort((a, b) => b.count - a.count).map(problemCard).join('') : '<div class="card empty">No problems reported.</div>'}</div>

    <div class="row" style="justify-content:space-between;margin-top:28px">
      <h2 style="margin:0">Users</h2>
      <input class="search" id="q" placeholder="Search email or AC name" value="${esc(filter)}" />
    </div>
    <div class="list" style="margin-top:10px">${users.map(userCard).join('') || '<div class="card empty">No users match.</div>'}</div>
  `;
  document.getElementById('refresh').onclick = load;
  document.getElementById('logout').onclick = async () => { await sb.auth.signOut(); showLogin(); };
  const qEl = document.getElementById('q');
  qEl.oninput = e => { filter = e.target.value; render(); const el = document.getElementById('q'); el.focus(); el.setSelectionRange(filter.length, filter.length); };
}

const tile = (n, l, tone = '') => `<div class="card tile"><div class="n" ${tone ? `style="color:var(--${tone})"` : ''}>${esc(n)}</div><div class="l">${esc(l)}</div></div>`;
const badge = cause => `<span class="badge ${CAUSES[cause].tone}">${esc(CAUSES[cause].label)}</span>`;

function issueCard({ cause, user, device }) {
  const c = CAUSES[cause];
  return `<div class="card issue">${badge(cause)}<div>
    <div class="what">${esc(device.name)}: ${esc(c.what)}</div>
    <div class="fix">What to do: ${esc(c.fix)}</div>
    <div class="who">${esc(user.email)} · ${esc(device.room_name || '')} · last heard ${esc(ago(device.last_seen))}${device.last_error ? ' · ' + esc(device.last_error) : ''}</div>
  </div></div>`;
}

function problemCard(g) {
  const [what, fix] = ERROR_TYPES[g.type] || [g.type, 'Send this to the developer.'];
  return `<div class="card issue"><span class="badge bad">${g.count}×</span><div>
    <div class="what">${esc(what)}</div>
    <div class="fix">What to do: ${esc(fix)}</div>
    <div class="who">${g.owners.size} user(s) · last ${esc(ago(g.last))}${g.sample ? ' · e.g. “' + esc(String(g.sample).slice(0, 140)) + '”' : ''}</div>
  </div></div>`;
}

function userCard(u) {
  const tone = { ok: ['ok', 'All working'], warn: ['warn', 'Needs attention'], bad: ['bad', 'Home Bridge off'], idle: ['idle', 'No ACs yet'] }[u.worst];
  return `<details class="card user"><summary>
      <div><div style="font-weight:600">${esc(u.email)}</div>
      <div class="meta">${u.devices.length} AC(s) · bridge ${u.bridges.length ? (u.bridgeOnline ? 'on' : 'off, last ' + esc(ago(u.bridges.map(b => b.last_seen).sort().pop()))) : 'not installed'} · last sign-in ${esc(ago(u.lastSignInAt))}</div></div>
      <span class="badge ${tone[0]}">${tone[1]}</span>
    </summary>
    <div class="devices">${u.devices.length ? u.devices.map(deviceCard).join('') : '<div class="empty">This user has not added an AC yet.</div>'}</div>
  </details>`;
}

function deviceCard(d) {
  const c = CAUSES[d.cause];
  const state = d.is_on ? `On · ${esc(d.mode)} · set ${esc(d.target_temp)}°` : 'Off';
  return `<div class="dev">
    <div class="top"><div><b>${esc(d.name)}</b> <span class="sub">${esc(d.vendor)} · ${esc(d.room_name || '')}</span></div>${badge(d.cause)}</div>
    <div class="facts"><span>${state}</span>${d.current_temp != null ? `<span>Room ${esc(d.current_temp)}°</span>` : ''}<span>Last heard ${esc(ago(d.last_seen))}</span>${d.ip_address ? `<span>${esc(d.ip_address)}</span>` : ''}</div>
    ${d.cause !== 'working' ? `<div class="note">${esc(c.what)} <span class="sub">${esc(c.fix)}</span></div>` : ''}
    ${d.recent.length ? `<div class="cmds">${d.recent.map(cmd => `<div>${esc(ago(cmd.created_at))}: ${esc(Object.entries(cmd.patch || {}).map(([k, v]) => `${k} ${JSON.stringify(v)}`).join(', '))} → <b>${esc(cmd.status)}</b>${cmd.error ? ' (' + esc(cmd.error) + ')' : ''}</div>`).join('')}</div>` : ''}
  </div>`;
}

function showLogin(message = '') {
  app.innerHTML = `<form class="login card" id="f">
    <h1>ClimateKing Admin</h1>
    <div class="sub">Sign in with your ClimateKing app account.</div>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required />
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required />
    <button class="primary" type="submit">Sign in</button>
    <div class="err" id="err">${esc(message)}</div>
  </form>`;
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    document.getElementById('err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('pw').value });
    if (error) document.getElementById('err').textContent = error.message;
    else load();
  };
}

async function load() {
  const { data: s } = await sb.auth.getSession();
  if (!s.session) return showLogin();
  const res = await fetch('/api/overview', { headers: { Authorization: `Bearer ${s.session.access_token}` } });
  const body = await res.json().catch(() => ({ error: 'Unexpected response' }));
  if (!res.ok) {
    if (res.status === 401) return showLogin('Please sign in again.');
    app.innerHTML = `<div class="card"><h1>ClimateKing Admin</h1><p class="err">${esc(body.error)}</p><button id="logout">Sign out</button></div>`;
    document.getElementById('logout').onclick = async () => { await sb.auth.signOut(); showLogin(); };
    return;
  }
  data = body;
  render();
}

(async () => {
  const cfg = await fetch('/api/config').then(r => r.json());
  if (!cfg.supabaseUrl) { app.innerHTML = '<p class="err">Dashboard is not configured yet.</p>'; return; }
  sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  load();
  setInterval(() => { if (data && document.visibilityState === 'visible') load(); }, 60 * 1000);
})();
</script>
</body>
</html>
